version: '3.8'

services:
  harmonices-mundi:
    build:
      context: .
      target: dev
    container_name: harmonices-mundi-app
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - NODE_ENV=development
    restart: unless-stopped
